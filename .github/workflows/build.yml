name: Build

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:

env:
  TZ: Europe/Zurich

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      - name: Cache npm and Cypress
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.npm
            ~/.cache/Cypress
          key: ${{ runner.os }}-node26-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node26-

      - name: Install
        run: npm install --force # fix dependency issues

      - name: Lint
        run: npm run lint

      - name: Cypress run
        uses: cypress-io/github-action@4ce68f262a3888d22cf3175d62010a145ba737ee # v7.4.8
        with:
          config: video=false
          install-command: "true" # re-use installed npm from above
          start: npm run start

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: cypress-screenshots
          path: cypress/screenshots
